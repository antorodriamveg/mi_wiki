<!DOCTYPE html>
<html>
<head>
    <title>Wiki de Ala Giratoria Militar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<button class="modo-oscuro-btn" onclick="toggleDarkMode()">Modo oscuro</button>

<header>
    <h1>Wiki de Ala Giratoria Militar</h1>
</header>

<div class="container">
    <h2>Fabricantes</h2>

    <ul class="lista">
        {% for fab in fabricantes %}
            <li>
                <a href="/fabricante/{{ fab[0] }}">
                    {{ fab[1] }} ({{ fab[2] }})
                </a>
            </li>
        {% endfor %}
    </ul>

    <a href="/fabricante/nuevo" class="boton">Agregar fabricante</a>
</div>

<script>
function toggleDarkMode() {
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
