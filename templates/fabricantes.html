<!DOCTYPE html>
<html>
<head>
    <title>HELIPEDIA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>HELIPEDIA</h1>
    <p>todo sobre aeronaves de ala gitaroria militares</p>
    <p> version alpha </p>
</header>

<div class="container">

    <h2>Fabricantes</h2>

    {% if fabricantes %}

    <ul class="lista">
        {% for fab in fabricantes %}
        <li>

            <a href="/fabricante/{{ fab[0] }}">
                <strong>{{ fab[1] }}</strong> ({{ fab[2] }})
            </a>

            <br>

            <a href="/fabricante/editar/{{ fab[0] }}" class="boton">
                 Editar fabricante
            </a>

        </li>

        <br>

        {% endfor %}
    </ul>

    {% else %}

    <p>No hay fabricantes cargados todavía.</p>

    {% endif %}

    <a href="/fabricante/nuevo" class="boton">
         Agregar fabricante
    </a>

</div>

</body>
</html>
