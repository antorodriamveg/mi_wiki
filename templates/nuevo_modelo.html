<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Modelo</title>

    <style>
        :root {
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #222;
            --label: #555;
            --border: #ccc;
            --button-bg: #007bff;
            --button-hover: #0056b3;
        }

        body.dark {
            --bg: #1e1e1e;
            --card-bg: #2a2a2a;
            --text: #eaeaea;
            --label: #cfcfcf;
            --border: #555;
            --button-bg: #0099ff;
            --button-hover: #007acc;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
            transition: background 0.3s;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
        }

        label {
            font-weight: bold;
            margin-top: 18px;
            display: block;
            color: var(--label);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            background: var(--card-bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s, border 0.3s;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            margin-top: 30px;
            width: 100%;
            padding: 14px;
            background: var(--button-bg);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--button-hover);
        }

        .volver {
            margin-top: 20px;
            text-align: center;
        }

        .volver a {
            color: var(--button-bg);
            text-decoration: none;
            font-size: 15px;
        }

        .volver a:hover {
            text-decoration: underline;
        }

        .modo-oscuro-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--button-bg);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <button class="modo-oscuro-btn" onclick="toggleDarkMode()">Modo oscuro</button>

    <div class="container">
        <h1>Agregar modelo para {{ fabricante[1] }}</h1>

        <form action="/modelo/crear/{{ fabricante[0] }}" method="POST">

            <label>Nombre del modelo</label>
            <input type="text" name="nombre" required>

            <label>Rol</label>
            <input type="text" name="rol" required>

            <label>Generación</label>
            <input type="number" name="generacion" required>

            <label>Año</label>
            <input type="number" name="anio" required>

            <label>Descripción</label>
            <textarea name="descripcion" required></textarea>

            <label>Imagen (URL)</label>
            <input type="text" name="imagen_url">

            <button type="submit">Guardar modelo</button>
        </form>

        <div class="volver">
            <a href="/fabricante/{{ fabricante[0] }}">← Volver al fabricante</a>
        </div>
    </div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark");
        }
    </script>

</body>
</html>
