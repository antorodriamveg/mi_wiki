<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Modelo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">
    <h1>Agregar modelo para {{ fabricante[1] }}</h1>

    <form action="/modelo/nuevo/{{ fabricante[0] }}" method="POST">

        <label>Nombre del modelo</label>
        <input type="text" name="nombre" required>

        <label>Rol</label>
        <input type="text" name="rol" required>

        <label>Generación</label>
        <input type="number" name="generacion" required>

        <label>Año</label>
        <input type="number" name="anio" required>

        <label>Descripción</label>
        <textarea name="descripcion" required></textarea>

        <label>Imagen principal (URL)</label>
        <input type="text" name="imagen_url">

        <label>Imagen secundaria (URL)</label>
        <input type="text" name="imagen_url_2">

        <label>Imagen terciaria (URL)</label>
        <input type="text" name="imagen_url_3">

        <label>Imagen adicional (URL)</label>
        <input type="text" name="imagen_url_4">

        <button type="submit">Guardar modelo</button>
    </form>

    <div class="volver">
        <a href="/fabricante/{{ fabricante[0] }}">← Volver al fabricante</a>
    </div>
</div>

</body>
</html>
