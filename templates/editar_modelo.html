<!DOCTYPE html>
<html>
<head>
<title>Editar Modelo</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
 
<body>
 
<header>
<h1>Editar Modelo</h1>
</header>
 
<div class="container">
 
<form method="POST">
 
<label>Nombre:</label>
<input type="text"
name="nombre"
value="{{ modelo[2] }}"
required>
 
<br><br>
 
<label>Rol:</label>
<input type="text"
name="rol"
value="{{ modelo[3] }}"
required>
 
<br><br>
 
<label>Generación:</label>
<input type="number"
name="generacion"
value="{{ modelo[4] }}"
required>
 
<br><br>
 
<label>Año:</label>
<input type="number"
name="anio"
value="{{ modelo[5] }}"
required>
 
<br><br>
 
<label>Descripción:</label>
<textarea name="descripcion" rows="8" required>{{ modelo[6] }}</textarea>
 
<br><br>
 
<label>Imagen principal (URL):</label>
<input type="text"
name="imagen_url"
value="{{ modelo[7] }}">

<br><br>

<label>Imagen secundaria (URL):</label>
<input type="text"
name="imagen_url_2"
value="{{ modelo[8] }}">

<br><br>

<label>Imagen terciaria (URL):</label>
<input type="text"
name="imagen_url_3"
value="{{ modelo[9] }}">

<br><br>

<label>Imagen adicional (URL):</label>
<input type="text"
name="imagen_url_4"
value="{{ modelo[10] }}">
 
<br><br>
 
<button type="submit" class="boton">
Guardar cambios
</button>
 
</form>
 
<br>
 
<a href="/modelo/{{ modelo[0] }}" class="boton-secundario">
Volver
</a>
 
</div>
 
</body>
</html>
