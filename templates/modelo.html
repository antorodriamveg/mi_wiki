<!DOCTYPE html>
<html>
<head>
    <title>{{ modelo[1] }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>{{ modelo[1] }}</h1>
</header>

<div class="container">

    {% if modelo[6] %}
        <img src="{{ modelo[6] }}" class="imagen-modelo">
    {% endif %}

    <h2></h2>

    <p><strong>Rol:</strong> {{ modelo[2] }}</p>
    <p><strong>Generación:</strong> {{ modelo[3] }}ª</p>
    <p><strong>Año:</strong> {{ modelo[4] }}</p>
    
    <h3>Informacón</h3>

    <pre class="texto-modelo">
    {{ modelo[5] }}
    </pre>
    
    <h3>Fabricante</h3>
    <p>{{ modelo[7] }} ({{ modelo[8] }})</p>

    <hr>

    {% if session.get("admin") %}

    <a href="/modelo/editar/{{ modelo[0] }}" class="boton">
         Editar modelo
    </a>

    <a href="/modelo/borrar/{{ modelo[0] }}"
       class="boton-secundario"
       onclick="return confirm('¿Seguro que quieres borrar este modelo?');">
        Borrar modelo
    </a>

    <br><br>
    
    {% endif %}

    <a href="/" class="boton-secundario">
        ← Volver al inicio
    </a>

</div>

</body>
</html>
